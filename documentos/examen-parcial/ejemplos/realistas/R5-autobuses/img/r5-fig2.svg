<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 164" width="760" height="164"><rect width="760" height="164" fill="#FFFFFF"/><rect x="1.0" y="1" width="372.0" height="142" fill="#FFFFFF" stroke="#B8C2CC"/><rect x="1.0" y="1" width="372.0" height="26" fill="#F4F6F8" stroke="#B8C2CC"/><text x="13.0" y="19" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1F4E79" font-weight="bold" text-anchor="start">Fotograma de RIB-S01</text><rect x="11.0" y="36" width="352.0" height="44" fill="#EEF1F4"/><text x="17.0" y="54" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#5F6B76" font-style="italic" text-anchor="start">Contenido observado:</text><text x="17.0" y="69" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#2B2F33" text-anchor="start">La directora general en una mesa con el logotipo de la</text><text x="17.0" y="84" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#2B2F33" text-anchor="start">empresa. Chaqueta azul. Cartel detrás: «Plan de líneas 2027».</text><text x="13.0" y="104" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#5F6B76" font-weight="bold" text-anchor="start">Búsqueda inversa:</text><text x="13.0" y="117" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5F6B76" text-anchor="start">Audio: «En enero el billete costará el triple». El sonido no</text><text x="13.0" y="130" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5F6B76" text-anchor="start">coincide con el movimiento de los labios en dos momentos.</text><rect x="387.0" y="1" width="372.0" height="142" fill="#FFFFFF" stroke="#B8C2CC"/><rect x="387.0" y="1" width="372.0" height="26" fill="#F4F6F8" stroke="#B8C2CC"/><text x="399.0" y="19" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1F4E79" font-weight="bold" text-anchor="start">Vídeo original (canal oficial)</text><rect x="397.0" y="36" width="352.0" height="44" fill="#EEF1F4"/><text x="403.0" y="54" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#5F6B76" font-style="italic" text-anchor="start">Contenido observado:</text><text x="403.0" y="69" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#2B2F33" text-anchor="start">Mismo plano, misma chaqueta azul y mismo cartel. Publicado el</text><text x="403.0" y="84" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#2B2F33" text-anchor="start">12/03/2025.</text><text x="399.0" y="104" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#5F6B76" font-weight="bold" text-anchor="start">Búsqueda inversa:</text><text x="399.0" y="117" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#2E6B3A" text-anchor="start">Audio: la directora presenta las nuevas líneas de 2027. No habla</text><text x="399.0" y="130" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#2E6B3A" text-anchor="start">del precio del billete.</text><text x="380.0" y="158" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#5F6B76" font-style="italic" text-anchor="middle">RIB-I01 · Búsqueda inversa del fotograma en Google Lens · consulta del 08/11/2026</text></svg>